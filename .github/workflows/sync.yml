name: Sync Model Pricing

on:
  schedule:
    # Every Monday at 03:00 UTC
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Sync pricing.json from upstream datasets
        run: node scripts/sync.mjs

      - name: Check for pricing changes
        id: diff
        run: |
          if git diff --quiet pricing.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump patch version and update sync date in manifest
        if: steps.diff.outputs.changed == 'true'
        run: |
          node -e '
          const fs = require("fs");
          const m = JSON.parse(fs.readFileSync("cc-router-plugin.json", "utf8"));
          const [maj, min, pat] = m.version.split(".").map(Number);
          m.version = `${maj}.${min}.${pat + 1}`;
          const today = new Date().toISOString().slice(0, 10);
          for (const k of Object.keys(m.description)) {
            m.description[k] = m.description[k].replace(/\d{4}-\d{2}-\d{2}/g, today);
          }
          fs.writeFileSync("cc-router-plugin.json", JSON.stringify(m, null, 2) + "\n");
          '

      - name: Validate with cc-router Rust checker
        if: steps.diff.outputs.changed == 'true'
        run: |
          git clone --depth 1 https://github.com/finch-xu/cc-router .cc-router
          cargo run --release --manifest-path .cc-router/src-tauri/Cargo.toml \
            -p cc-router-plugin-spec --bin ccr-plugin-check -- . > check.json
          cat check.json
          node -e 'const r = JSON.parse(require("fs").readFileSync("check.json","utf8")); if (!r.ok) process.exit(1);'
          rm -rf .cc-router check.json

      - name: Create Pull Request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          BRANCH="sync/pricing-${TODAY}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add pricing.json cc-router-plugin.json
          git commit -m "chore: sync model pricing (${TODAY})"
          git push -u origin "$BRANCH" --force
          gh pr create \
            --title "chore: sync model pricing (${TODAY})" \
            --body "Automated weekly pricing sync from models.dev, OpenRouter, and LiteLLM. Validated with \`ccr-plugin-check\`." \
            || true
